name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html style.css app.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icon
        run: |
          if [ -f android-icons.zip ]; then
            unzip -o android-icons.zip -d android/app/src/main/res
          else
            echo "::warning::android-icons.zip not found, building with the default icon"
          fi

      - name: Sync
        run: npx cap sync android

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ProjectTree.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Project Tree build ${{ github.run_number }}
          files: ProjectTree.apk

      - name: Keep a copy as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectTree-APK
          path: ProjectTree.apk
